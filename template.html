<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケモンGO 個体データベース</title>
<style>
:root{
  --bg:#f5f6fa;--panel:#ffffff;--panel2:#f0f2f8;--text:#1b2030;--sub:#6b7388;--line:#e2e6ef;
  --accent:#4a63e8;--accent-soft:#e8ecff;--gold:#d99a00;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1118;--panel:#171b25;--panel2:#1e2330;--text:#e6e9f2;--sub:#97a0b5;--line:#2a3142;
    --accent:#8ea0ff;--accent-soft:#232b4a;--gold:#f0b429;--shadow:none}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px 48px}

/* header */
header{padding:22px 0 12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;justify-content:space-between}
h1{font-size:22px;margin:0;letter-spacing:.02em}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}

/* source */
.src{width:100%;font-size:12px;color:var(--sub)}
.src.err{color:#c4432c}

/* toolbar */
.toolbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit}
.search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:18px}
select,.chip,.seg button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 11px;cursor:pointer}
select{appearance:auto}
.chip{border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:8px 12px}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{margin-left:auto;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.reset{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:6px}

/* type badges */
.type{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;color:#fff;font-weight:600;white-space:nowrap;margin-right:4px;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--sub);padding:0 7px;border-radius:6px;font-size:11px;margin:1px 3px 1px 0;white-space:nowrap}
.tag.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.star{color:var(--gold);letter-spacing:.5px;font-size:12px;white-space:nowrap}
.star .off{color:var(--line);opacity:.9}
.star sup{font-size:9px;vertical-align:top;margin-left:1px}
.iv{display:inline-flex;gap:3px;font-variant-numeric:tabular-nums}
.iv i{font-style:normal;font-size:11px;padding:0 5px;border-radius:5px;background:var(--panel2);color:var(--sub)}
.iv i.max{background:#2f9e5b;color:#fff}

/* table view */
.tablebox{margin-top:12px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:calc(100vh - 210px)}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-size:12px;color:var(--sub);font-weight:600;cursor:pointer;user-select:none}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--accent)}
thead th.sorted::after{content:attr(data-arrow);margin-left:4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.name b{font-size:15px}
td.name small{display:block;color:var(--sub);font-size:11px}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--panel2) 45%,transparent)}
tbody tr:hover{background:var(--accent-soft)}
td.sticky{position:sticky;left:0;background:var(--panel);z-index:1}
tbody tr:hover td.sticky{background:var(--accent-soft)}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--panel2);vertical-align:middle;margin-left:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* cards */
.cards{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rt{text-align:right;flex:none}
.lv{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;margin-left:6px;white-space:nowrap}
.card h3{margin:0;font-size:16px;line-height:1.3}
.card .nick{color:var(--sub);font-size:12px}
.card .meta{font-size:12px;color:var(--sub)}
.card .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px}
.card .nums div{background:var(--panel2);border-radius:8px;padding:5px 6px;text-align:center}
.card .nums span{display:block;font-size:10px;color:var(--sub)}
.card .nums b{font-size:14px;font-variant-numeric:tabular-nums}
.card .foot{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto;padding-top:4px}

/* detail */
dialog{border:none;border-radius:16px;padding:0;width:min(640px,calc(100% - 24px));max-height:88vh;background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,14,24,.5)}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead h2{margin:0;font-size:20px;line-height:1.25}
.dhead .sub{color:var(--sub);font-size:13px;margin-top:3px}
.close{border:none;background:var(--panel2);color:var(--sub);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.dbody{padding:16px 20px 22px;overflow:auto;max-height:calc(88vh - 90px)}
.sec{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 6px;letter-spacing:.04em}
.sec:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kv div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:11px;color:var(--sub)}
.kv b{font-size:15px;font-variant-numeric:tabular-nums;word-break:break-all}
.kv .wide{grid-column:1/-1}
.pill{display:inline-block;margin:2px 4px 2px 0}
@media (max-width:560px){
  .kv{grid-template-columns:1fr}
  h1{font-size:19px}
  .count{margin-left:0;width:100%}
  .seg{flex:1}.seg button{flex:1}
}

/* ---- visual polish ---- */
h1{background:linear-gradient(90deg,var(--accent),#d6457a);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.stat{position:relative;overflow:hidden;padding:8px 14px}
.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent)}
.stat b{font-size:19px}
.toolbar{box-shadow:0 6px 16px -12px rgba(20,30,60,.35)}
select,.chip,.seg button{transition:border-color .15s,background .15s,color .15s}
.search input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on:hover{color:#fff}
.seg button.on{box-shadow:inset 0 -2px 0 var(--accent)}
.card{position:relative;overflow:hidden;border-radius:16px;transition:transform .15s,box-shadow .15s,border-color .15s}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c,var(--accent))}
.card:hover{box-shadow:0 12px 28px -10px color-mix(in srgb,var(--c,var(--accent)) 55%,transparent)}
.card h3{font-size:17px;font-weight:800;letter-spacing:.01em}
.card .nums div{border:1px solid color-mix(in srgb,var(--c,var(--line)) 22%,transparent);background:color-mix(in srgb,var(--c,var(--panel2)) 7%,var(--panel2))}
.card .nums b{font-size:15px}
.card .meta{line-height:1.5}
thead th{letter-spacing:.02em}
thead th:first-child{position:sticky;left:0;z-index:4;background:var(--panel2)}
td.sticky{box-shadow:inset -1px 0 0 var(--line)}
tbody tr{box-shadow:inset 3px 0 0 transparent;transition:background .12s,box-shadow .12s}
tbody tr:hover{box-shadow:inset 3px 0 0 var(--c,var(--accent))}
tbody tr:hover td.sticky{background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--panel))}
.bar{width:76px}
.bar i{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ffffff))}
.iv i{min-width:24px;text-align:center}
.type{padding:2px 10px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tag.hot{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
dialog .dhead{background:linear-gradient(135deg,color-mix(in srgb,var(--c,var(--accent)) 26%,var(--panel)),var(--panel));border-bottom:none;padding:22px 22px 14px}
dialog .dhead h2{font-size:23px;font-weight:800;letter-spacing:.01em}
.dhead .sub{font-variant-numeric:tabular-nums}
.sec{text-transform:none;color:var(--text);font-size:13px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.sec::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--c,var(--accent))}
.kv div{transition:background .15s,transform .15s;border:1px solid transparent}
.kv div:hover{background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--panel2));border-color:color-mix(in srgb,var(--c,var(--accent)) 25%,transparent)}
.kv b{font-size:16px;font-weight:700}
.close:hover{background:var(--line);color:var(--text)}
.count{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ポケモンGO 個体データベース</h1>
    <div class="stats" id="stats"></div>
    <div class="src" id="src"></div>
  </header>

  <div class="toolbar">
    <div class="row">
      <div class="search"><input type="search" id="q" placeholder="名前・ニックネーム・技・地域で検索" autocomplete="off"></div>
      <select id="type" aria-label="タイプ"><option value="">タイプ：すべて</option></select>
      <select id="rank" aria-label="ランク"><option value="">ランク：すべて</option></select>
      <select id="sort" aria-label="並べ替え"></select>
      <button class="chip" id="dir" title="並べ替えの向きを切り替え"></button>
      <div class="seg" id="view">
        <button data-v="cards" class="on">カード</button>
        <button data-v="table">表</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="cards" class="cards"></div>
  <div id="tableWrap" class="tablebox" hidden>
    <table id="tbl"><thead></thead><tbody></tbody></table>
  </div>
</div>

<dialog id="dlg"><div class="dhead"><div id="dt"></div><button class="close" id="dc" aria-label="閉じる">×</button></div><div class="dbody" id="db"></div></dialog>

<script>
let DATA = /*__DATA__*/[];
const EMBED_COUNT = DATA.length;

const TYPE_COLOR = {"ノーマル":"#8e919c","ほのお":"#ee6a2f","みず":"#3d8cf0","でんき":"#e5b400","くさ":"#38a84b","こおり":"#4fc3d8","かくとう":"#c4432c","どく":"#9a4fc2","じめん":"#b8893c","ひこう":"#7f9df2","エスパー":"#ea5b8e","むし":"#8eaa1d","いわ":"#a99a62","ゴースト":"#6b55ad","ドラゴン":"#5b46d8","あく":"#4d4140","はがね":"#6f8fa3","フェアリー":"#ef84c6"};
const CHIP_FLAGS = [
  {key:"シャドウ",  test:d=>/シャドウ/.test(d["特徴"])},
  {key:"色違い",    test:d=>/色/.test(d["ニックネーム"]) || /色違い/.test(d["特徴"]+d["色違い率"])},
  {key:"キラ",      test:d=>/キラ/.test(d["特徴"])},
  {key:"XXL",       test:d=>/XXL/.test(d["特徴"])},
  {key:"とくしゅ",  test:d=>/とくしゅ/.test(d["特徴"])},
  {key:"ダイマックス", test:d=>/ダイマックス/.test(d["特徴"])},
  {key:"交換",      test:d=>d["交換"]==="YES"},
];
const NUM_COLS = ["CP(シャドウも考慮)","AP(レイドアタッカーとしての強さポイント)","SP(火力の強さポイント)","DP(ジム防衛での強さポイント)"];
const SHORT = {"CP(シャドウも考慮)":"CP","AP(レイドアタッカーとしての強さポイント)":"AP","SP(火力の強さポイント)":"SP","DP(ジム防衛での強さポイント)":"DP"};
const IVMAX = 15;
const LVK = "Lv(PL*2-1で1から99に収めることにより最大2文字を実現)";

const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?-Infinity:n};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rankNum=d=>num(d["ランク(並び替え用)"]);
let MAX = {};
function computeMax(){MAX={};NUM_COLS.forEach(k=>MAX[k]=Math.max(...DATA.map(d=>num(d[k]))))}
computeMax();
const typeBadges=d=>[d["タイプ1"],d["タイプ2"]].filter(Boolean).map(t=>`<span class="type" style="background:${TYPE_COLOR[t]||"#888"}">${esc(t)}</span>`).join("");
const tags=d=>(d["特徴"]||"").split("、").filter(Boolean).map(t=>`<span class="tag${/シャドウ|キラ|色|XXL|とくしゅ/.test(t)?" hot":""}">${esc(t)}</span>`).join("");
const ivCells=d=>{
  const v=[d["こうげき"],d["ぼうぎょ"],d["HP"]].map(x=>+x);
  return `<span class="iv">${v.map(x=>`<i class="${x===IVMAX?"max":""}">${x}</i>`).join("")}</span>`;
};
const bar=(k,d)=>{const v=num(d[k]);const pct=Math.max(0,Math.min(100,v/MAX[k]*100));return `${Math.round(v).toLocaleString()}<span class="bar"><i style="width:${pct.toFixed(1)}%"></i></span>`};
const starHTML=d=>{const r=d["ランク"]||"";const f=(r.match(/✦/g)||[]).length,h=(r.match(/✧/g)||[]).length;return `<span class="star" title="${esc(r)}">${"★".repeat(f)}<span class="off">${"☆".repeat(h)}</span>${/⁺/.test(r)?"<sup>+</sup>":""}</span>`};

/* ---------- state ---------- */
const st={q:"",type:"",rank:"",flags:new Set(),view:"cards",sort:"CP(シャドウも考慮)",dir:-1};
const TABLE_COLS=[
  {k:"ポケモン名",label:"ポケモン",cls:"sticky name",render:d=>`<b>${esc(d["ポケモン名"])}</b>${d["ニックネーム"]&&d["ニックネーム"]!==d["ポケモン名"]?`<small>${esc(d["ニックネーム"])}</small>`:""}`},
  {k:LVK,label:"Lv",cls:"num",num:1,render:d=>`<b>Lv${esc(d[LVK])}</b>`,sortKey:LVK},
  {k:"ランク(並び替え用)",label:"ランク",render:d=>starHTML(d),sortKey:"ランク(並び替え用)"},
  {k:"CP(シャドウも考慮)",label:"CP",cls:"num",num:1,render:d=>bar("CP(シャドウも考慮)",d)},
  {k:"AP(レイドアタッカーとしての強さポイント)",label:"AP",cls:"num",num:1,render:d=>bar("AP(レイドアタッカーとしての強さポイント)",d)},
  {k:"SP(火力の強さポイント)",label:"SP",cls:"num",num:1,render:d=>bar("SP(火力の強さポイント)",d)},
  {k:"DP(ジム防衛での強さポイント)",label:"DP",cls:"num",num:1,render:d=>bar("DP(ジム防衛での強さポイント)",d)},
  {k:"タイプ1",label:"タイプ",render:d=>typeBadges(d),sortKey:"タイプ1"},
  {k:"個体値",label:"個体値（攻/防/HP）",render:d=>ivCells(d),sortKey:"個体値%"},
  {k:"特徴",label:"特徴",render:d=>tags(d),sortKey:"特徴"},
  {k:"通常技",label:"技",render:d=>`${esc(d["通常技"])}<br><small style="color:var(--sub)">${esc(d["スペシャル技1"])}${d["スペシャル技2"]?" / "+esc(d["スペシャル技2"]):""}</small>`,sortKey:"通常技"},
  {k:"入手地域",label:"入手地",render:d=>esc([d["入手県"],d["入手地域"]].filter(x=>x&&x!=="-").join(" "))},
  {k:"入手日",label:"入手日",render:d=>esc(d["入手日"])},
  {k:"ID",label:"ID",cls:"num",num:1,render:d=>esc(d["ID"])},
];

/* ---------- sort ---------- */
const SORT_OPTS=[
  {k:"CP(シャドウも考慮)",l:"CP"},
  {k:"AP(レイドアタッカーとしての強さポイント)",l:"AP"},
  {k:"SP(火力の強さポイント)",l:"SP"},
  {k:"DP(ジム防衛での強さポイント)",l:"DP"},
  {k:LVK,l:"Lv"},
  {k:"ランク(並び替え用)",l:"ランク"},
  {k:"個体値%",l:"個体値"},
  {k:"ポケモン名",l:"名前"},
  {k:"ID",l:"ID"},
];
const isNumKey=k=>!["ポケモン名","タイプ1","通常技","特徴"].includes(k);
function setSort(k){
  st.sort=k;
  st.dir=isNumKey(k)?-1:1;
  const sel=$("#sort"); if(sel) sel.value=SORT_OPTS.some(o=>o.k===k)?k:sel.value;
  syncDir();
  saveSort();
}
function syncDir(){
  const b=$("#dir"); if(!b) return;
  const num=isNumKey(st.sort);
  b.textContent=(st.dir<0?"↓ ":"↑ ")+(num?(st.dir<0?"大きい順":"小さい順"):(st.dir<0?"Z→A":"A→Z"));
}

/* ---------- saved sort state (per browser) ---------- */
const SORT_KEY="pokego_sort_state";
const EXTRA_SORT_KEYS=["タイプ1","通常技","特徴"];
function loadSort(){
  try{
    const v=JSON.parse(localStorage.getItem(SORT_KEY)||"null");
    if(v&&typeof v.sort==="string"&&(SORT_OPTS.some(o=>o.k===v.sort)||EXTRA_SORT_KEYS.includes(v.sort))&&(v.dir===1||v.dir===-1)){
      st.sort=v.sort;st.dir=v.dir;
    }
  }catch(e){}
}
function saveSort(){
  try{localStorage.setItem(SORT_KEY,JSON.stringify({sort:st.sort,dir:st.dir}))}catch(e){}
}

/* ---------- populate selects & stats (re-run when data changes) ---------- */
function populate(){
  const types=[...new Set(DATA.flatMap(d=>[d["タイプ1"],d["タイプ2"]]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
  $("#type").innerHTML='<option value="">タイプ：すべて</option>';
  $("#type").insertAdjacentHTML("beforeend",types.map(t=>`<option>${esc(t)}</option>`).join(""));
  const ranks=[...new Map(DATA.map(d=>[d["ランク"],rankNum(d)])).entries()].sort((a,b)=>b[1]-a[1]);
  $("#rank").innerHTML='<option value="">ランク：すべて</option>';
  $("#rank").insertAdjacentHTML("beforeend",ranks.map(([r])=>`<option value="${esc(r)}">${starHTML({"ランク":r})}</option>`).join(""));
  // rank select shows plain text
  [...$("#rank").options].forEach(o=>{if(o.value)o.textContent=o.value.replace(/✦/g,"★").replace(/✧/g,"☆").replace(/⁺/g,"+")});
  const cnt={total:DATA.length,shadow:DATA.filter(d=>/シャドウ/.test(d["特徴"])).length,
    shiny:DATA.filter(d=>/色/.test(d["ニックネーム"])).length,
    top:DATA.filter(d=>rankNum(d)>=1400000).length};
  $("#stats").innerHTML=[["全件",cnt.total],["シャドウ",cnt.shadow],["色違い",cnt.shiny],["高ランク",cnt.top]]
    .map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}

/* ---------- Googleスプレッドシートから取得 ---------- */
const SHEET={id:"1Pk5BLLuranWM8vQBk5BHiITI045ZZviS91tp2hWdaLY",gid:"1159297132"};
function fetchSheet(){
  return new Promise((resolve,reject)=>{
    const cb="__sheetCb"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    let t=null;
    const finish=fn=>{clearTimeout(t);delete window[cb];s.remove();fn()};
    t=setTimeout(()=>finish(()=>reject(new Error("timeout"))),10000);
    window[cb]=resp=>finish(()=>{try{resolve(sheetToRows(resp))}catch(e){reject(e)}});
    s.onerror=()=>finish(()=>reject(new Error("network")));
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET.id}/gviz/tq?gid=${SHEET.gid}&headers=1&tqx=out:json;responseHandler:${cb}`;
    document.head.appendChild(s);
  });
}
function sheetToRows(resp){
  const cols=resp.table.cols.map((c,i)=>(c.label||"").trim()||`col${i}`);
  return resp.table.rows
    .map(r=>{const o={};cols.forEach((k,i)=>{const c=r.c[i];o[k]=c==null?"":String(c.f??c.v??"")});return o})
    .filter(o=>o["ポケモン名"]&&!String(o["ID"]).startsWith("#"));
}
function setSrc(text,err){const el=$("#src");el.textContent=text;el.classList.toggle("err",!!err)}
async function refreshFromSheet(){
  setSrc("スプレッドシートから読み込み中…");
  try{
    const rows=await fetchSheet();
    if(!rows.length)throw new Error("empty");
    DATA=rows;computeMax();populate();render();
    setSrc(`Googleスプレッドシートから取得（${rows.length}件・${new Date().toLocaleString("ja-JP")}）`);
  }catch(e){
    setSrc(`埋め込みデータ（${EMBED_COUNT}件）を表示中。最新の取得に失敗しました`,true);
  }
}

/* ---------- init ---------- */
function init(){
  loadSort();
  populate();
  $("#chips").innerHTML=CHIP_FLAGS.map(f=>`<button class="chip" data-f="${f.key}">${f.key}</button>`).join("")+`<button class="reset" id="reset">条件をクリア</button>`;

  $("#sort").innerHTML=SORT_OPTS.map(o=>`<option value="${esc(o.k)}">${esc(o.l)}</option>`).join("");
  $("#sort").value=st.sort;
  $("#sort").onchange=e=>{setSort(e.target.value);render()};
  $("#dir").onclick=()=>{st.dir*=-1;syncDir();saveSort();render()};
  syncDir();
  $("#q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
  $("#type").onchange=e=>{st.type=e.target.value;render()};
  $("#rank").onchange=e=>{st.rank=e.target.value;render()};
  $("#chips").onclick=e=>{
    if(e.target.id==="reset"){st.flags.clear();document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));render();return}
    const b=e.target.closest(".chip");if(!b)return;
    const f=b.dataset.f;st.flags.has(f)?st.flags.delete(f):st.flags.add(f);b.classList.toggle("on");render();
  };
  $("#view").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.view=b.dataset.v;
    document.querySelectorAll("#view button").forEach(x=>x.classList.toggle("on",x===b));render()};

  $("#tbl thead").innerHTML="<tr>"+TABLE_COLS.map(c=>`<th class="${c.cls?.includes("num")?"num":""}" data-k="${esc(c.sortKey||c.k)}">${esc(c.label)}</th>`).join("")+"</tr>";
  $("#tbl thead").onclick=e=>{
    const th=e.target.closest("th");if(!th)return;const k=th.dataset.k;
    if(st.sort===k)st.dir*=-1;else{setSort(k)}
    syncDir();saveSort();
    render();
  };
  $("#cards").onclick=e=>{const c=e.target.closest(".card");if(c)detail(DATA[+c.dataset.i])};
  $("#tbl tbody").onclick=e=>{const tr=e.target.closest("tr");if(tr)detail(DATA[+tr.dataset.i])};
  $("#dc").onclick=()=>$("#dlg").close();
  $("#dlg").onclick=e=>{if(e.target.id==="dlg")$("#dlg").close()};
  render();
  setSrc(`埋め込みデータ（${EMBED_COUNT}件）を表示中`);
  refreshFromSheet();
}

/* ---------- filter & sort ---------- */
function filtered(){
  const idx=DATA.map((_,i)=>i).filter(i=>{
    const d=DATA[i];
    if(st.type&&d["タイプ1"]!==st.type&&d["タイプ2"]!==st.type)return false;
    if(st.rank&&d["ランク"]!==st.rank)return false;
    for(const f of st.flags){const c=CHIP_FLAGS.find(x=>x.key===f);if(c&&!c.test(d))return false}
    if(st.q&&!Object.values(d).join(" ").toLowerCase().includes(st.q))return false;
    return true;
  });
  const isNum=isNumKey(st.sort);
  idx.sort((a,b)=>{
    const x=DATA[a][st.sort],y=DATA[b][st.sort];
    const r=isNum?num(x)-num(y):String(x).localeCompare(String(y),"ja");
    return (r||rankNum(DATA[a])-rankNum(DATA[b]))*st.dir;
  });
  return idx;
}

/* ---------- render ---------- */
function render(){
  const idx=filtered();
  $("#count").textContent=`${idx.length} / ${DATA.length} 件`;
  const isCards=st.view==="cards";
  $("#cards").hidden=!isCards;
  $("#tableWrap").hidden=isCards;

  if(isCards){
    $("#cards").innerHTML=idx.map(i=>{const d=DATA[i];return `
      <article class="card" data-i="${i}" style="--c:${TYPE_COLOR[d["タイプ1"]]||"#4a63e8"}">
        <div class="top">
          <div><h3>${esc(d["ポケモン名"])}<span class="lv">Lv${esc(d[LVK])}</span></h3>${d["ニックネーム"]&&d["ニックネーム"]!==d["ポケモン名"]?`<div class="nick">${esc(d["ニックネーム"])}</div>`:""}</div>
          <div class="rt">${starHTML(d)}</div>
        </div>
        <div>${typeBadges(d)}</div>
        <div class="nums">
          ${NUM_COLS.map(k=>`<div><span>${SHORT[k]}</span><b>${Math.round(num(d[k])).toLocaleString()}</b></div>`).join("")}
        </div>
        <div class="meta">個体値 ${ivCells(d)}</div>
        <div class="meta">${esc(d["通常技"])}${d["スペシャル技1"]?" ・ "+esc(d["スペシャル技1"]):""}</div>
        <div class="foot">${tags(d)}</div>
      </article>`}).join("")||`<p style="color:var(--sub)">該当するポケモンがいません</p>`;
  }else{
    document.querySelectorAll("thead th").forEach(th=>{
      const on=th.dataset.k===st.sort;
      th.classList.toggle("sorted",on);
      th.dataset.arrow=on?(st.dir<0?"▼":"▲"):"";
    });
    $("#tbl tbody").innerHTML=idx.map(i=>{const d=DATA[i];
      return `<tr data-i="${i}" style="--c:${TYPE_COLOR[d["タイプ1"]]||"#4a63e8"}">${TABLE_COLS.map(c=>`<td class="${c.cls||""}">${c.render(d)}</td>`).join("")}</tr>`}).join("");
  }
}

/* ---------- detail ---------- */
function detail(d){
  const nick=d["ニックネーム"]&&d["ニックネーム"]!==d["ポケモン名"]?` <span class="sub">${esc(d["ニックネーム"])}</span>`:"";
  $("#dt").innerHTML=`<h2>${esc(d["ポケモン名"])}</h2><div class="sub">${esc(d["ランク"])} ・ Lv${esc(d[LVK])} ・ ID ${esc(d["ID"])}</div>`;
  const kv=(l,v,wide)=>v&&v!=="-"?`<div class="${wide?"wide":""}"><span>${esc(l)}</span><b>${v}</b></div>`:"";
  $("#db").innerHTML=`
    <div class="sec">タイプ・特徴</div>
    <div>${typeBadges(d)} ${tags(d)}</div>
    <div class="sec">強さ</div>
    <div class="kv">
      ${NUM_COLS.map(k=>kv(SHORT[k],Math.round(num(d[k])).toLocaleString())).join("")}
      ${kv("1 in X",esc(d["1 in X"]))}
      ${kv("実質攻撃力",esc(d["実質攻撃力"]))}
      ${kv("実質耐久力",esc(d["実質耐久力"]))}
      ${kv("レベル",`Lv${esc(d[LVK])}`)}${kv("PL",esc(d["PL"]))}
    </div>
    <div class="sec">個体値</div>
    <div class="kv">
      ${kv("攻撃",esc(d["こうげき"]))}${kv("防御",esc(d["ぼうぎょ"]))}${kv("HP",esc(d["HP"]))}${kv("個体値%",esc(d["個体値%"]))}
    </div>
    <div class="sec">技</div>
    <div class="kv">
      ${kv("通常技",esc(d["通常技"]),1)}${kv("スペシャル技1",esc(d["スペシャル技1"]),1)}${kv("スペシャル技2",esc(d["スペシャル技2"]),1)}
    </div>
    <div class="sec">入手</div>
    <div class="kv">
      ${kv("国・県",esc([d["入手国"],d["入手県"]].filter(x=>x&&x!=="-").join(" ")))}
      ${kv("地域",esc(d["入手地域"]))}
      ${kv("入手日",esc(d["入手日"]))}
      ${kv("歩いた距離 (km)",esc(d["歩いた距離(km)"]))}
      ${kv("捕獲ボール",esc(d["捕獲ボール"]))}
      ${kv("産地",esc(d["産地"]))}
      ${kv("交換",esc(d["交換"]))}
      ${kv("色違い率",esc(d["色違い率"]))}
    </div>
    <div class="sec">評価</div>
    <div class="kv">
      ${["GP(いろんなコンテンツで使える度合い)","EP(育成オススメ度)","LP(お気に入り度合い)"].map(k=>kv(k.split("(")[0],esc(d[k]))).join("")}
    </div>`;
  $("#dlg").style.setProperty("--c",TYPE_COLOR[d["タイプ1"]]||"#4a63e8");
  $("#dlg").showModal();
}

init();
</script>
