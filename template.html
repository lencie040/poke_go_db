<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポケモンGO 個体データベース</title>
<meta name="description" content="ポケモンGOのコレクションを検索して、CP・個体値・技を見比べられる個体データベース。">
<style>
:root{
  color-scheme:light dark;
  --bg:#f1f5f7;--panel:#fff;--panel2:#eef3f6;--text:#122638;--sub:#4d6070;--line:#d7e1e7;
  --accent:#0b655f;--accent-soft:#dff2ef;--focus:#16887a;
  --hero:#071e31;--hero-text:#fff8ec;--ink:#0c2939;
  --shadow:0 2px 4px #132a4108,0 7px 23px #132a4107;--radius:16px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a1724;--panel:#112333;--panel2:#192e40;--text:#eff6fa;--sub:#b2c3cf;--line:#2c4354;
    --accent:#9ae7d8;--accent-soft:#184049;--focus:#9ae7d8;--ink:#082533;
    --shadow:0 4px 18px #020f1a55;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:1rem/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{width:min(1280px,100% - 64px);margin-inline:auto}
.topbar{background:#081d2e;color:#f7f2e8;border-bottom:1px solid #28455a}
.topbar .wrap{min-height:58px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:11px;font-size:.875rem;font-weight:780;letter-spacing:.065em}
.brand-mark{width:25px;aspect-ratio:1;border-radius:50%;background:linear-gradient(#ffbd6f 44%,#081d2e 44% 56%,#dae9e8 56%);border:2px solid #dae9e8;display:grid;place-items:center}
.brand-mark::after{content:"";width:7px;aspect-ratio:1;border-radius:50%;background:#fff2da;border:2px solid #081d2e}
main{padding-block:22px 52px}
.hero{
  isolation:isolate;position:relative;display:grid;align-content:center;min-height:302px;
  overflow:hidden;padding:34px clamp(24px,4.1vw,58px);background:var(--hero);color:var(--hero-text);
  border:1px solid #193b51;border-radius:23px;box-shadow:var(--shadow)
}
.hero::before,.hero::after{content:"";position:absolute;inset:0;z-index:-1}
.hero::before{background:url("./assets/moonlit-valley.webp") center 23% / cover no-repeat}
.hero::after{background:linear-gradient(90deg,#071e31b5 0%,#071e3140 43%,transparent 71%)}
.hero h1{font-size:clamp(1.95rem,4.35vw,3.75rem);font-weight:850;line-height:1.14;margin:0 0 13px;letter-spacing:-.045em}
.hero h1 span{display:block;color:#ffcc88;font-size:.51em;font-weight:780;letter-spacing:.07em;margin-bottom:.32em}
.hero p{margin:0;color:#e4edf0;font-size:.9375rem}
.src{
  justify-self:start;display:flex;align-items:center;gap:8px;margin:20px 0 0;padding:5px 11px;
  border:1px solid #a7d4d24d;border-radius:999px;background:#071e31be;
  color:#c1f1e5;font-size:.8125rem
}
.src::before{content:"";width:7px;height:7px;flex:none;border-radius:50%;background:currentColor}
.src.err{color:#ffd5af}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 25px}
.stat{
  --stat:#3c8b8a;display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto;
  column-gap:12px;align-items:center;text-align:left;border:1px solid var(--line);
  background:var(--panel);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)
}
.stat:nth-child(2){--stat:#8964c4}
.stat:nth-child(3){--stat:#bc8028}
.stat:nth-child(4){--stat:#d06d50}
.stat:hover,.stat[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.stat-icon{
  grid-row:1/3;display:grid;place-items:center;width:40px;aspect-ratio:1;border-radius:12px;
  background:color-mix(in srgb,var(--stat) 18%,var(--panel));color:var(--text);font-size:1.125rem
}
.stat-label{font-size:.875rem;color:var(--sub)}
.stat b{font-size:1.7rem;line-height:1.12;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.collection-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
h2{font-size:1.4rem;line-height:1.3;margin:0}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:3px;gap:2px}
.seg button{background:transparent;border:0;border-radius:7px;padding:6px 12px;font-size:.875rem;color:var(--sub)}
.seg button.on{background:var(--ink);color:#fff;font-weight:750}
@media(prefers-color-scheme:dark){.seg button.on{background:#a7e8de;color:#082533}}
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:minmax(220px,1fr) minmax(122px,auto) minmax(122px,auto) minmax(145px,auto) auto;gap:8px}
.search{position:relative;min-width:0}
.search::before{content:"";position:absolute;left:14px;top:13px;width:10px;height:10px;border:2px solid var(--sub);border-radius:50%;pointer-events:none}
.search::after{content:"";position:absolute;left:26px;top:25px;width:6px;height:2px;background:var(--sub);transform:rotate(45deg);pointer-events:none}
.search input,select,.direction{width:100%;min-height:44px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.search input{padding-left:38px;background:var(--panel);border-color:color-mix(in srgb,var(--accent) 44%,var(--line))}
.search input::placeholder{color:var(--sub)}
select{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:right 16px center,right 11px center;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
.direction{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip,.reset,.pager button,.empty button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;min-height:36px;font-size:.875rem}
.chip.on,.chip:hover,.direction:hover,.pager button:not(:disabled):hover,.empty button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.reset{margin-left:auto;color:var(--accent);border-color:transparent}
.reset:hover{text-decoration:underline}
.count{margin:16px 0 10px;color:var(--sub);font-size:.875rem;font-weight:650;font-variant-numeric:tabular-nums}
.type,.tag{display:inline-block;white-space:nowrap;padding:3px 9px;border-radius:999px;font-size:.8125rem;font-weight:650}
.type{background:color-mix(in srgb,var(--type) 13%,var(--panel));border:1px solid color-mix(in srgb,var(--type) 44%,var(--line));color:var(--text)}
.tag{background:var(--panel2);color:var(--sub)}
.tag.hot{background:var(--accent-soft);color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.star{color:#805d00;letter-spacing:.04em;font-size:.875rem;white-space:nowrap}
.star .off{color:var(--sub)}
.star.r1{color:var(--sub)}.star.r2{color:#27733c}.star.r3{color:#225eb2}.star.r4{color:#793d9d}
.star.r6{color:#a84821}.star.r7{color:#ab315c}
@media(prefers-color-scheme:dark){
  .star{color:#ffdb81}.star.r2{color:#91dca2}.star.r3{color:#a8ccff}.star.r4{color:#e1b4fa}
  .star.r6{color:#ffb898}.star.r7{color:#ffb8d1}
}
.star sup{font-size:.75em}
.iv{display:inline-flex;gap:3px;font-variant-numeric:tabular-nums}
.iv i{font-style:normal;font-size:.8125rem;min-width:25px;text-align:center;padding:1px 4px;border-radius:5px;background:var(--panel2);color:var(--sub)}
.iv i.max{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(264px,100%),1fr));gap:12px}
.card{
  position:relative;min-width:0;display:flex;flex-direction:column;gap:10px;padding:0 14px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
}
.card:hover,.card:focus-within{border-color:color-mix(in srgb,var(--c) 66%,var(--line))}
.card-heading{
  margin:0 -14px;padding:12px 14px 10px;border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
  border-bottom:1px solid color-mix(in srgb,var(--c) 30%,var(--line));
  background:linear-gradient(112deg,color-mix(in srgb,var(--c) 23%,var(--panel)) 0%,color-mix(in srgb,var(--c) 7%,var(--panel)) 82%)
}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;min-height:2.8rem}
.card h3{margin:0;font-size:1.12rem;line-height:1.35;overflow-wrap:anywhere}
.detail-link,.sort-head{border:0;padding:0;background:none;text-align:inherit;font:inherit}
.detail-link{color:var(--text)}
.card .detail-link::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
.card .detail-link:focus-visible{outline:none}
.card .detail-link:focus-visible::after{outline:3px solid var(--focus);outline-offset:2px}
.lv,.nick,.meta{font-size:.875rem;color:var(--sub)}
.lv{
  padding:2px 7px;border:1px solid color-mix(in srgb,var(--c) 37%,var(--line));border-radius:6px;
  background:var(--panel);font-size:.8125rem;white-space:nowrap;font-variant-numeric:tabular-nums
}
.card .rankline{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;margin-top:5px}
.card .nums{
  display:grid;grid-template-columns:minmax(0,1.32fr) repeat(3,minmax(0,1fr));
  background:var(--panel2);border-radius:10px;overflow:hidden
}
.card .nums div{padding:7px 2px;display:grid;align-content:center;text-align:center}
.card .nums div+div{border-left:1px solid var(--line)}
.card .nums .metric-cp{background:var(--ink);color:#fff;letter-spacing:-.02em}
.card .nums span{font-size:.8125rem;line-height:1.25;color:var(--sub)}
.card .nums .metric-cp span{color:#b3e5e0}
.card .nums b{font-size:.9375rem;line-height:1.25;font-variant-numeric:tabular-nums}
.card .nums .metric-cp b{font-size:1.25rem}
.card .foot{margin-top:auto}
.card .foot:empty{display:none}
.tablebox{overflow:auto;max-height:min(70vh,660px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;white-space:nowrap;font-size:.875rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
thead th{position:sticky;top:0;background:var(--ink);border-color:var(--ink);z-index:2;color:#dae9ef}
tbody tr:nth-child(even),tbody tr:nth-child(even) td.sticky{background:var(--panel2)}
thead th:first-child{left:0;z-index:3}
.sort-head{min-height:28px;color:inherit}
th.sorted{color:#a4eadf}
th.sorted .sort-head::after{content:attr(data-arrow);margin-left:6px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.name small{display:block;color:var(--sub)}
td.sticky{position:sticky;left:0;background:var(--panel);box-shadow:inset -1px 0 var(--line);z-index:1}
tbody tr:hover,tbody tr:hover td.sticky,tbody tr:nth-child(even):hover,tbody tr:nth-child(even):hover td.sticky{background:var(--accent-soft)}
tbody tr{cursor:pointer}
.bar{display:inline-block;width:42px;height:5px;border-radius:4px;background:var(--panel2);vertical-align:middle;margin-left:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.empty{padding:40px 16px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);color:var(--sub)}
.empty p{margin:0 0 12px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;font-size:.875rem;color:var(--sub)}
.pager button{border-radius:9px;color:var(--text)}
.pager button:disabled{opacity:.45;cursor:default}
dialog{border:1px solid var(--line);border-radius:var(--radius);padding:0;width:min(640px,100% - 24px);max-height:88dvh;background:var(--panel);color:var(--text);box-shadow:0 20px 60px #09160e55}
dialog::backdrop{background:#051625b0}
.dhead{position:sticky;top:0;padding:16px 20px;background:linear-gradient(110deg,color-mix(in srgb,var(--c) 26%,var(--panel)),var(--panel));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dhead .sub{color:var(--sub);font-size:.875rem;margin-top:4px}
.close{border:1px solid var(--line);background:var(--panel);width:42px;height:42px;border-radius:11px;font-size:1.35rem;flex:none}
.dbody{padding:16px 20px 22px}
.sec{font-size:.95rem;font-weight:750;margin:18px 0 7px;padding-inline-start:8px;border-inline-start:3px solid var(--accent)}
.sec:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.kv div{background:var(--panel2);border-radius:8px;padding:7px 10px}
.kv span{display:block;font-size:.8125rem;color:var(--sub)}
.kv b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv .wide{grid-column:1/-1}
@media(max-width:900px){
  .wrap{width:calc(100% - 40px)}
  .row{grid-template-columns:repeat(4,minmax(0,1fr))}
  .search{grid-column:1/-1}
}
@media(max-width:340px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){
  .wrap{width:calc(100% - 28px)}
  .topbar .wrap{min-height:52px}
  main{padding-top:14px}
  .hero{min-height:210px;padding:18px 15px;border-radius:16px}
  .hero::before{background-position:66% 50%}
  .hero::after{background:linear-gradient(90deg,#071e31ed 2%,#071e31b8 54%,#071e3140)}
  .hero h1{font-size:clamp(1.45rem,6.9vw,2.1rem)}
  .hero p{font-size:.875rem}
  .hero .src{margin-top:11px;padding:4px 8px}
  .stats{gap:5px;margin:8px 0 16px}
  .stat{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:6px 2px;text-align:center;border-radius:10px}
  .stat-icon{width:23px;font-size:.875rem;border-radius:6px}
  .stat-label{font-size:.8125rem;white-space:nowrap}
  .stat b{font-size:1.3rem}
  .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar{padding:10px}
  .chip,.reset{padding-inline:9px}
  .reset{margin-left:0}
  .dhead,.dbody{padding-inline:14px}
}
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><div class="brand"><span class="brand-mark" aria-hidden="true"></span>ポケモンGO 個体DB</div></div></header>
<main class="wrap">
  <section class="hero" aria-labelledby="page-title">
    <h1 id="page-title"><span>ポケモンGO</span>個体データベース</h1>
    <p>コレクションを検索して、CP・個体値・技を見比べる。</p>
    <div class="src" id="src" role="status"></div>
  </section>
  <div class="stats" id="stats" role="group" aria-label="コレクションの集計"></div>

  <section aria-labelledby="collection-title">
    <div class="collection-head">
      <h2 id="collection-title">コレクション</h2>
      <div class="seg" id="view" role="group" aria-label="表示形式">
        <button type="button" data-v="cards" class="on" aria-pressed="true">カード</button>
        <button type="button" data-v="table" aria-pressed="false">一覧表</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="row">
        <div class="search"><input type="search" id="q" aria-label="ポケモンを検索" placeholder="名前・技・地域で検索" autocomplete="off"></div>
        <select id="type" aria-label="タイプ"><option value="">すべてのタイプ</option></select>
        <select id="rank" aria-label="ランク"><option value="">すべてのランク</option></select>
        <select id="sort" aria-label="並べ替え"></select>
        <button type="button" class="direction" id="dir" title="並べ替えの向きを切り替え"></button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="特徴で絞り込み"></div>
    </div>

    <p class="count" id="count" role="status" tabindex="-1"></p>
    <div id="cards" class="cards"></div>
    <div id="tableWrap" class="tablebox" role="region" aria-label="個体データ一覧表" tabindex="0" hidden>
      <table id="tbl"><thead></thead><tbody></tbody></table>
    </div>
    <div id="empty" class="empty" hidden>
      <p>条件に一致するポケモンが見つかりません。</p>
      <button type="button" id="emptyReset">条件をクリア</button>
    </div>
    <nav id="pager" class="pager" aria-label="検索結果のページ" hidden>
      <button type="button" id="prev">前のページ</button>
      <span id="page"></span>
      <button type="button" id="next">次のページ</button>
    </nav>
  </section>
  <noscript>個体データを表示するには JavaScript を有効にしてください。</noscript>
</main>

<dialog id="dlg" aria-labelledby="detail-title">
  <div class="dhead"><div id="dt"></div><button type="button" class="close" id="dc" aria-label="閉じる" autofocus>×</button></div>
  <div class="dbody" id="db"></div>
</dialog>

<script>
let DATA = /*__DATA__*/[];
const EMBED_COUNT = DATA.length;

const TYPE_COLOR = {"ノーマル":"#8e919c","ほのお":"#ee6a2f","みず":"#3d8cf0","でんき":"#e5b400","くさ":"#38a84b","こおり":"#4fc3d8","かくとう":"#c4432c","どく":"#9a4fc2","じめん":"#b8893c","ひこう":"#7f9df2","エスパー":"#ea5b8e","むし":"#8eaa1d","いわ":"#a99a62","ゴースト":"#6b55ad","ドラゴン":"#5b46d8","あく":"#4d4140","はがね":"#6f8fa3","フェアリー":"#ef84c6"};
const CHIP_FLAGS = [
  {key:"シャドウ",  test:d=>/シャドウ/.test(d["特徴"])},
  {key:"色違い",    test:d=>/色/.test(d["ニックネーム"]) || /色違い/.test(d["特徴"]+d["色違い率"])},
  {key:"キラ",      test:d=>/キラ/.test(d["特徴"])},
  {key:"XXL",       test:d=>/XXL/.test(d["特徴"])},
  {key:"とくしゅ",  test:d=>/とくしゅ/.test(d["特徴"])},
  {key:"ダイマックス", test:d=>/ダイマックス/.test(d["特徴"])},
  {key:"高ランク", test:d=>rankNum(d)>=1400000},
  {key:"交換",      test:d=>d["交換"]==="YES"},
];
const NUM_COLS = ["CP(シャドウも考慮)","AP(レイドアタッカーとしての強さポイント)","SP(火力の強さポイント)","DP(ジム防衛での強さポイント)"];
const SHORT = {"CP(シャドウも考慮)":"CP","AP(レイドアタッカーとしての強さポイント)":"AP","SP(火力の強さポイント)":"SP","DP(ジム防衛での強さポイント)":"DP"};
const IVMAX = 15;
const LVK = "Lv(PL*2-1で1から99に収めることにより最大2文字を実現)";

const $=s=>document.querySelector(s);
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?-Infinity:n};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rankNum=d=>num(d["ランク(並び替え用)"]);
const formatNumber=value=>Number.isFinite(num(value))?numberFormat.format(Math.round(num(value))):"—";
const numberFormat=new Intl.NumberFormat("ja-JP");
const normalize=value=>String(value??"").normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const dateNum=value=>{
  const parts=normalize(value).match(/^(\d{4})[/.年-]\s*(\d{1,2})[/.月-]\s*(\d{1,2})日?$/);
  return parts?Number(parts[1])*10000+Number(parts[2])*100+Number(parts[3]):-Infinity;
};
const typeColor=t=>Object.hasOwn(TYPE_COLOR,t)?TYPE_COLOR[t]:"#418166";
let MAX={},searchIndex=[];
function indexData(){
  MAX=Object.fromEntries(NUM_COLS.map(k=>[k,0]));
  searchIndex=DATA.map(d=>{
    NUM_COLS.forEach(k=>{MAX[k]=Math.max(MAX[k],num(d[k]))});
    return normalize(Object.values(d).join(" "));
  });
}
indexData();
const typeBadges=d=>[d["タイプ1"],d["タイプ2"]].filter(Boolean).map(t=>`<span class="type" style="--type:${typeColor(t)}">${esc(t)}</span>`).join("");
const tags=d=>(d["特徴"]||"").split("、").filter(Boolean).map(t=>`<span class="tag${/シャドウ|キラ|色|XXL|とくしゅ/.test(t)?" hot":""}">${esc(t)}</span>`).join("");
const ivCells=d=>`<span class="iv" aria-label="攻撃・防御・HP">${["こうげき","ぼうぎょ","HP"].map(k=>`<i class="${num(d[k])===IVMAX?"max":""}">${formatNumber(d[k])}</i>`).join("")}</span>`;
const bar=(k,d)=>{
  const v=num(d[k]);
  if(!Number.isFinite(v)||!MAX[k])return formatNumber(v);
  const pct=Math.max(0,Math.min(100,v/MAX[k]*100));
  return `${formatNumber(v)}<span class="bar" aria-hidden="true"><i style="width:${pct.toFixed(1)}%"></i></span>`;
};
const nickname=d=>d["ニックネーム"]&&d["ニックネーム"]!==d["ポケモン名"]?esc(d["ニックネーム"]):"";
const detailButton=d=>`<button type="button" class="detail-link" aria-haspopup="dialog">${esc(d["ポケモン名"])}</button>`;

const starHTML=d=>{const r=d["ランク"]||"";const f=(r.match(/✦/g)||[]).length,h=(r.match(/✧/g)||[]).length;return `<span class="star r${f}" title="${esc(r)}" aria-label="ランク ${f} ${/⁺/.test(r)?"プラス":""}">${"★".repeat(f)}<span class="off">${"☆".repeat(h)}</span>${/⁺/.test(r)?"<sup>+</sup>":""}</span>`};

/* ---------- state ---------- */
const PAGE_SIZE=24;
const st={page:0,q:"",type:"",rank:"",flags:new Set(),view:"cards",sort:"CP(シャドウも考慮)",dir:-1};
const TABLE_COLS=[
  {k:"ポケモン名",label:"ポケモン",cls:"sticky name",render:d=>`<b>${detailButton(d)}</b>${nickname(d)?`<small>${nickname(d)}</small>`:""}`},
  {k:LVK,label:"Lv",cls:"num",num:1,render:d=>`<b>Lv${esc(d[LVK])}</b>`,sortKey:LVK},
  {k:"ランク(並び替え用)",label:"ランク",render:d=>starHTML(d),sortKey:"ランク(並び替え用)"},
  {k:"CP(シャドウも考慮)",label:"CP",cls:"num",num:1,render:d=>bar("CP(シャドウも考慮)",d)},
  {k:"AP(レイドアタッカーとしての強さポイント)",label:"AP",cls:"num",num:1,render:d=>bar("AP(レイドアタッカーとしての強さポイント)",d)},
  {k:"SP(火力の強さポイント)",label:"SP",cls:"num",num:1,render:d=>bar("SP(火力の強さポイント)",d)},
  {k:"DP(ジム防衛での強さポイント)",label:"DP",cls:"num",num:1,render:d=>bar("DP(ジム防衛での強さポイント)",d)},
  {k:"タイプ1",label:"タイプ",render:d=>typeBadges(d),sortKey:"タイプ1"},
  {k:"個体値",label:"個体値（攻/防/HP）",render:d=>ivCells(d),sortKey:"個体値%"},
  {k:"特徴",label:"特徴",render:d=>tags(d),sortKey:"特徴"},
  {k:"通常技",label:"技",render:d=>`${esc(d["通常技"])}<br><small style="color:var(--sub)">${esc(d["スペシャル技1"])}${d["スペシャル技2"]?" / "+esc(d["スペシャル技2"]):""}</small>`,sortKey:"通常技"},
  {k:"入手地域",label:"入手地",render:d=>esc([d["入手県"],d["入手地域"]].filter(x=>x&&x!=="-").join(" "))},
  {k:"入手日",label:"入手日",render:d=>esc(d["入手日"])},
  {k:"ID",label:"ID",cls:"num",num:1,render:d=>esc(d["ID"])},
];

/* ---------- sort ---------- */
const SORT_OPTS=[
  {k:"CP(シャドウも考慮)",l:"CP"},
  {k:"AP(レイドアタッカーとしての強さポイント)",l:"AP"},
  {k:"SP(火力の強さポイント)",l:"SP"},
  {k:"DP(ジム防衛での強さポイント)",l:"DP"},
  {k:LVK,l:"Lv"},
  {k:"ランク(並び替え用)",l:"ランク"},
  {k:"個体値%",l:"個体値"},
  {k:"ポケモン名",l:"名前"},
  {k:"入手日",l:"入手日"},
  {k:"タイプ1",l:"タイプ"},
  {k:"特徴",l:"特徴"},
  {k:"通常技",l:"通常技"},
  {k:"入手地域",l:"入手地"},
  {k:"ID",l:"ID"},
];
const isTextKey=k=>["ポケモン名","タイプ1","通常技","特徴","入手地域"].includes(k);
function setSort(k){
  st.sort=k;
  st.dir=isTextKey(k)?1:-1;
}
function syncSort(){
  $("#sort").value=st.sort;
  $("#dir").textContent=isTextKey(st.sort)
    ?(st.dir<0?"降順":"昇順")
    :st.sort==="入手日"?(st.dir<0?"新しい順":"古い順")
    :(st.dir<0?"大きい順":"小さい順");
  saveSort();
}

/* ---------- saved sort state (per browser) ---------- */
const SORT_KEY="pokego_sort_state";
function loadSort(){
  try{
    const v=JSON.parse(localStorage.getItem(SORT_KEY)||"null");
    if(v&&typeof v.sort==="string"&&SORT_OPTS.some(o=>o.k===v.sort)&&(v.dir===1||v.dir===-1)){
      st.sort=v.sort;st.dir=v.dir;
    }
  }catch(e){}
}
function saveSort(){
  try{localStorage.setItem(SORT_KEY,JSON.stringify({sort:st.sort,dir:st.dir}))}catch(e){}
}

/* ---------- populate selects & stats (re-run when data changes) ---------- */
function populate(){
  const types=[...new Set(DATA.flatMap(d=>[d["タイプ1"],d["タイプ2"]]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));
  $("#type").innerHTML='<option value="">すべてのタイプ</option>'+types.map(t=>`<option>${esc(t)}</option>`).join("");
  const ranks=[...new Set(DATA.map(d=>d["ランク"]).filter(Boolean))].sort((a,b)=>rankOrder(b)-rankOrder(a));
  $("#rank").innerHTML='<option value="">すべてのランク</option>'+ranks.map(r=>`<option value="${esc(r)}">${esc(r.replace(/✦/g,"★").replace(/✧/g,"☆").replace(/⁺/g,"+"))}</option>`).join("");
  for(const key of ["type","rank"]){
    const select=$("#"+key);
    select.value=st[key];
    st[key]=select.value;
  }
  const stats=[["全個体","","▦"],["シャドウ","シャドウ","◐"],["色違い","色違い","✦"],["高ランク","高ランク","★"]];
  $("#stats").innerHTML=stats.map(([label,key,icon])=>{
    const flag=CHIP_FLAGS.find(f=>f.key===key);
    const count=flag?DATA.filter(flag.test).length:DATA.length;
    return `<button type="button" class="stat" data-f="${key}" aria-pressed="false"><span class="stat-icon" aria-hidden="true">${icon}</span><span class="stat-label">${label}</span><b>${numberFormat.format(count)}</b></button>`;
  }).join("");
}

function rankOrder(rank){
  return (rank.match(/✦/g)||[]).length*2+Number(rank.includes("⁺"));
}

/* ---------- Googleスプレッドシートから取得 ---------- */
const SHEET={id:"1Pk5BLLuranWM8vQBk5BHiITI045ZZviS91tp2hWdaLY",gid:"1159297132"};
function fetchSheet(){
  return new Promise((resolve,reject)=>{
    const cb="__sheetCb"+Math.random().toString(36).slice(2);
    const s=document.createElement("script");
    let t=null;
    const finish=fn=>{clearTimeout(t);delete window[cb];s.remove();fn()};
    t=setTimeout(()=>finish(()=>reject(new Error("timeout"))),10000);
    window[cb]=resp=>finish(()=>{try{resolve(sheetToRows(resp))}catch(e){reject(e)}});
    s.onerror=()=>finish(()=>reject(new Error("network")));
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET.id}/gviz/tq?gid=${SHEET.gid}&headers=1&tqx=out:json;responseHandler:${cb}`;
    document.head.appendChild(s);
  });
}
function sheetToRows(resp){
  const cols=resp.table.cols.map((c,i)=>(c.label||"").trim()||`col${i}`);
  return resp.table.rows
    .map(r=>{const o={};cols.forEach((k,i)=>{const c=r.c[i];o[k]=c==null?"":String(c.f??c.v??"")});return o})
    .filter(o=>o["ポケモン名"]&&!String(o["ID"]).startsWith("#"));
}
function setSrc(text,err){const el=$("#src");el.textContent=text;el.classList.toggle("err",!!err)}
async function refreshFromSheet(){
  setSrc(`保存データを表示中 · ${EMBED_COUNT}件（同期中）`);
  try{
    const rows=await fetchSheet();
    if(!rows.length)throw new Error("empty");
    DATA=rows;indexData();populate();render();
    setSrc(`Google スプレッドシートと同期済み · ${rows.length}件`);
  }catch(e){
    setSrc(`保存データを表示中 · ${EMBED_COUNT}件（同期できませんでした）`,true);
  }
}

/* ---------- init ---------- */
function clearFilters(){
  st.q="";
  st.type="";
  st.rank="";
  st.flags.clear();
  for(const id of ["q","type","rank"])$("#"+id).value="";
  applyFilters();
}

function applyFilters(){
  st.page=0;
  render();
}

function toggleFlag(event){
  const button=event.target.closest("[data-f]");
  if(!button)return;
  const flag=button.dataset.f;
  if(!flag){
    clearFilters();
    return;
  }
  st.flags.has(flag)?st.flags.delete(flag):st.flags.add(flag);
  applyFilters();
}

function changePage(step){
  st.page+=step;
  render();
  $("#tableWrap").scrollTop=0;
  $("#count").focus();
}

function init(){
  loadSort();
  populate();
  $("#chips").innerHTML=CHIP_FLAGS.map(f=>`<button type="button" class="chip" data-f="${f.key}" aria-pressed="false">${f.key}</button>`).join("")
    +'<button type="button" class="reset" id="reset" hidden>条件をクリア</button>';
  $("#sort").innerHTML=SORT_OPTS.map(o=>`<option value="${esc(o.k)}">${esc(o.l)} 順</option>`).join("");
  syncSort();
  $("#sort").onchange=e=>{setSort(e.target.value);syncSort();applyFilters()};
  $("#dir").onclick=()=>{st.dir*=-1;syncSort();applyFilters()};
  for(const key of ["q","type","rank"]){
    $("#"+key).addEventListener(key==="q"?"input":"change",e=>{
      st[key]=key==="q"?e.target.value.trim():e.target.value;
      applyFilters();
    });
  }
  $("#chips").onclick=toggleFlag;
  $("#stats").onclick=toggleFlag;
  $("#reset").onclick=()=>{clearFilters();$("#q").focus()};
  $("#emptyReset").onclick=()=>{clearFilters();$("#q").focus()};
  $("#view").onclick=e=>{
    const button=e.target.closest("[data-v]");
    if(!button)return;
    st.view=button.dataset.v;
    document.querySelectorAll("#view button").forEach(b=>{
      b.classList.toggle("on",b===button);
      b.setAttribute("aria-pressed",b===button);
    });
    render();
  };

  $("#tbl thead").innerHTML="<tr>"+TABLE_COLS.map(c=>`<th scope="col" class="${c.num?"num":""}" data-k="${esc(c.sortKey||c.k)}"><button type="button" class="sort-head">${esc(c.label)}</button></th>`).join("")+"</tr>";
  $("#tbl thead").onclick=e=>{
    const th=e.target.closest("th");
    if(!th)return;
    const k=th.dataset.k;
    if(st.sort===k)st.dir*=-1;else setSort(k);
    syncSort();
    applyFilters();
  };
  for(const selector of ["#cards","#tbl tbody"]){
    $(selector).onclick=e=>{
      const item=e.target.closest("[data-i]");
      if(!item)return;
      item.querySelector(".detail-link").focus();
      detail(DATA[+item.dataset.i]);
    };
  }
  $("#prev").onclick=()=>changePage(-1);
  $("#next").onclick=()=>changePage(1);
  $("#dc").onclick=()=>$("#dlg").close();
  $("#dlg").onclick=e=>{if(e.target.id==="dlg")$("#dlg").close()};
  render();
  refreshFromSheet();
}

function filtered(){
  const terms=normalize(st.q).split(/\s+/).filter(Boolean);
  const flags=CHIP_FLAGS.filter(f=>st.flags.has(f.key));
  const idx=DATA.map((_,i)=>i).filter(i=>{
    const d=DATA[i];
    return (!st.type||d["タイプ1"]===st.type||d["タイプ2"]===st.type)
      &&(!st.rank||d["ランク"]===st.rank)
      &&flags.every(f=>f.test(d))
      &&terms.every(term=>searchIndex[i].includes(term));
  });
  const text=isTextKey(st.sort);
  const numeric=st.sort==="入手日"?dateNum:num;
  idx.sort((a,b)=>{
    const x=DATA[a][st.sort],y=DATA[b][st.sort];
    if(text){
      const result=String(x??"").localeCompare(String(y??""),"ja");
      if(result)return result*st.dir;
    }else{
      const left=numeric(x),right=numeric(y);
      if(left!==right){
        if(left===-Infinity)return 1;
        if(right===-Infinity)return -1;
        return (left-right)*st.dir;
      }
    }
    return (rankNum(DATA[b])-rankNum(DATA[a]))||a-b;
  });
  return idx;
}

function render(){
  const filteredIndices=filtered();
  const total=filteredIndices.length;
  const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  st.page=Math.min(Math.max(0,st.page),pages-1);
  const start=st.page*PAGE_SIZE;
  const idx=filteredIndices.slice(start,start+PAGE_SIZE);
  const active=Boolean(st.q||st.type||st.rank||st.flags.size);
  const isCards=st.view==="cards";
  $("#count").textContent=`${numberFormat.format(total)}件 / 全${numberFormat.format(DATA.length)}件${total?` · ${start+1}〜${start+idx.length}件を表示`:""}`;
  $("#cards").hidden=!isCards||!total;
  $("#tableWrap").hidden=isCards||!total;
  $("#empty").hidden=Boolean(total);
  $("#emptyReset").hidden=!active;
  $("#reset").hidden=!active;
  $("#pager").hidden=pages<=1;
  $("#page").textContent=`${st.page+1} / ${pages}`;
  $("#prev").disabled=st.page===0;
  $("#next").disabled=st.page===pages-1;
  document.querySelectorAll("[data-f]").forEach(b=>{
    const on=b.dataset.f?st.flags.has(b.dataset.f):!active;
    b.classList.toggle("on",on);
    b.setAttribute("aria-pressed",on);
  });

  if(isCards){
    $("#cards").innerHTML=idx.map(i=>{
      const d=DATA[i];
      const moves=[d["通常技"],d["スペシャル技1"],d["スペシャル技2"]].filter(Boolean).map(esc).join(" ・ ");
      return `
      <article class="card" data-i="${i}" style="--c:${typeColor(d["タイプ1"])}">
        <div class="card-heading">
          <div class="top">
            <div><h3>${detailButton(d)}</h3>${nickname(d)?`<div class="nick">${nickname(d)}</div>`:""}</div>
            <span class="lv">Lv ${esc(d[LVK]||"—")}</span>
          </div>
          <div class="rankline"><div class="badges">${typeBadges(d)}</div>${starHTML(d)}</div>
        </div>
        <div class="nums">
          ${NUM_COLS.map((k,index)=>`<div${index===0?' class="metric-cp"':""}><span>${SHORT[k]}</span><b>${formatNumber(d[k])}</b></div>`).join("")}
        </div>
        <div class="meta">個体値 ${ivCells(d)}</div>
        ${moves?`<div class="meta">${moves}</div>`:""}
        <div class="foot badges">${tags(d)}</div>
      </article>`;
    }).join("");
  }else{
    document.querySelectorAll("thead th").forEach(th=>{
      const on=th.dataset.k===st.sort;
      th.classList.toggle("sorted",on);
      if(on)th.setAttribute("aria-sort",st.dir<0?"descending":"ascending");
      else th.removeAttribute("aria-sort");
      th.firstElementChild.dataset.arrow=on?(st.dir<0?"▼":"▲"):"";
    });
    $("#tbl tbody").innerHTML=idx.map(i=>{
      const d=DATA[i];
      return `<tr data-i="${i}">${TABLE_COLS.map(c=>`<td class="${c.cls||""}">${c.render(d)}</td>`).join("")}</tr>`;
    }).join("");
  }
}

/* ---------- detail ---------- */
function detail(d){
  $("#dt").innerHTML=`<h2 id="detail-title">${esc(d["ポケモン名"])}</h2>${nickname(d)?`<div class="sub">${nickname(d)}</div>`:""}<div class="sub">${esc(d["ランク"])} ・ Lv${esc(d[LVK])} ・ ID ${esc(d["ID"])}</div>`;
  const kv=(l,v,wide)=>v&&v!=="-"?`<div class="${wide?"wide":""}"><span>${esc(l)}</span><b>${v}</b></div>`:"";
  $("#db").innerHTML=`
    <div class="sec">タイプ・特徴</div>
    <div class="badges">${typeBadges(d)} ${tags(d)}</div>
    <div class="sec">強さ</div>
    <div class="kv">
      ${NUM_COLS.map(k=>kv(k.replace(/\((.+)\)/," · $1"),formatNumber(d[k]))).join("")}
      ${kv("SCP",esc(d["SCP(Eは身内でやってるCP3500マックスのルール)"]))}
      ${kv("1 in X",esc(d["1 in X"]))}
      ${kv("実質攻撃力",esc(d["実質攻撃力"]))}
      ${kv("実質耐久力",esc(d["実質耐久力"]))}
      ${kv("レベル",`Lv${esc(d[LVK])}`)}${kv("PL",esc(d["PL"]))}
    </div>
    <div class="sec">個体値</div>
    <div class="kv">
      ${kv("攻撃",esc(d["こうげき"]))}${kv("防御",esc(d["ぼうぎょ"]))}${kv("HP",esc(d["HP"]))}${kv("個体値%",esc(d["個体値%"]))}
    </div>
    <div class="sec">技</div>
    <div class="kv">
      ${kv("通常技",esc(d["通常技"]),1)}${kv("スペシャル技1",esc(d["スペシャル技1"]),1)}${kv("スペシャル技2",esc(d["スペシャル技2"]),1)}
    </div>
    <div class="sec">入手</div>
    <div class="kv">
      ${kv("国・県",esc([d["入手国"],d["入手県"]].filter(x=>x&&x!=="-").join(" ")))}
      ${kv("地域",esc(d["入手地域"]))}
      ${kv("入手日",esc(d["入手日"]))}
      ${kv("歩いた距離 (km)",esc(d["歩いた距離(km)"]))}
      ${kv("捕獲ボール",esc(d["捕獲ボール"]))}
      ${kv("産地",esc(d["産地"]))}
      ${kv("交換",esc(d["交換"]))}
      ${kv("色違い率",esc(d["色違い率"]))}
    </div>
    <div class="sec">評価</div>
    <div class="kv">
      ${["GP(いろんなコンテンツで使える度合い)","EP(育成オススメ度)","LP(お気に入り度合い)"].map(k=>kv(k.replace(/\((.+)\)/," · $1"),esc(d[k]))).join("")}
    </div>`;
  $("#dlg").style.setProperty("--c",typeColor(d["タイプ1"]));
  $("#dlg").showModal();
  $("#dlg").scrollTop=0;
}

init();
</script>
